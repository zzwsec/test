name: nginx static container build
on:
  push:
    branches:
      - main
    workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: show os-release
        run: cat /etc/os-release

      - name: show mem
        run: free -h

      - name: show cpu
        run: lscpu