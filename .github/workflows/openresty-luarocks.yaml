name: openresty luarocks container build

# Reusable workflow inputs:
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#using-inputs-and-secrets-in-a-reusable-workflow
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      resty_version:
        description: OpenResty source version to build
        required: true
        type: string
      openssl_version:
        required: true
        type: string
      openssl_patch_version:
        required: true
        type: string

env:
  IMAGE_NAME: ${{ inputs.image_name }}
  RESTY_VERSION: ${{ inputs.resty_version }}
  RESTY_OPENSSL_VERSION: ${{ inputs.openssl_version }}
  RESTY_OPENSSL_PATCH_VERSION: ${{ inputs.openssl_patch_version }}

permissions:
  contents: read

jobs:
  build_docker:
    # Native runners keep compiled Lua rocks aligned with the target architecture.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux/amd64
            arch: amd64

          - os: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # LuaRocks extends the exact versioned static image and publishes one digest per arch.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: openresty/luarocks
          file: openresty/luarocks/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            RESTY_VERSION=${{ env.RESTY_VERSION }}
            RESTY_OPENSSL_VERSION=${{ env.RESTY_OPENSSL_VERSION }}
            RESTY_OPENSSL_PATCH_VERSION=${{ env.RESTY_OPENSSL_PATCH_VERSION }}
            OPENRESTY_IMAGE=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.RESTY_VERSION }}
          outputs: type=image,name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # https://docs.github.com/en/actions/tutorials/store-and-share-data
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: openresty-luarocks-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04

    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds
    needs:
      - build_docker

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: openresty-luarocks-digests-*
          merge-multiple: true

      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create \
            -t "${IMAGE}:${{ env.RESTY_VERSION }}-luarocks" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools inspect "${IMAGE}:${{ env.RESTY_VERSION }}-luarocks"
