name: nginx dynamic container build

# Reusable workflow inputs:
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#using-inputs-and-secrets-in-a-reusable-workflow
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      nginx_version:
        required: true
        type: string
      alpine_image:
        required: true
        type: string
env:
  IMAGE_NAME: ${{ inputs.image_name }}
  ALPINE_IMAGE: ${{ inputs.alpine_image }}
  NGINX_VERSION: ${{ inputs.nginx_version }}

permissions:
  contents: read

jobs:
  build_docker:
    # Match target architecture to a native GitHub-hosted runner.
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux/amd64
            arch: amd64

          - os: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Publish by digest first so parallel architectures never overwrite a shared tag.
      # Dynamic modules compile against the exact versioned static image passed below.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: nginx/dynamic
          file: nginx/dynamic/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE }}
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            NGINX_IMAGE=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.NGINX_VERSION }}
          outputs: type=image,name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Artifacts carry only digest names, not image layers, into the merge job.
      # https://docs.github.com/en/actions/tutorials/store-and-share-data
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: dynamic-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04

    # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idneeds
    needs:
      - build_docker

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: dynamic-digests-*
          merge-multiple: true

      # Create the final multi-platform dynamic tag after both native builds finish.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create \
            -t "${IMAGE}:${{ env.NGINX_VERSION }}-dynamic" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools inspect "${IMAGE}:${{ env.NGINX_VERSION }}-dynamic"
