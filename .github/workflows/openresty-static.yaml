name: openresty static container build

# Reusable workflow inputs keep dependency selection in the top-level pipeline:
# https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#using-inputs-and-secrets-in-a-reusable-workflow
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      resty_version:
        description: OpenResty source version to build
        required: true
        type: string
      alpine_image:
        required: true
        type: string
      openssl_version:
        required: true
        type: string
      openssl_patch_version:
        required: true
        type: string
      pcre_version:
        required: true
        type: string

env:
  IMAGE_NAME: ${{ inputs.image_name }}
  ALPINE_IMAGE: ${{ inputs.alpine_image }}
  RESTY_VERSION: ${{ inputs.resty_version }}
  RESTY_OPENSSL_VERSION: ${{ inputs.openssl_version }}
  RESTY_OPENSSL_PATCH_VERSION: ${{ inputs.openssl_patch_version }}
  RESTY_PCRE_VERSION: ${{ inputs.pcre_version }}

permissions:
  contents: read

jobs:
  build_docker:
    # https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/run-job-variations
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux/amd64
            arch: amd64

          - os: ubuntu-26.04-arm
            platform: linux/arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Push immutable architecture digests first, then create shared tags in merge.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: openresty/static
          file: openresty/static/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE }}
            RESTY_VERSION=${{ env.RESTY_VERSION }}
            RESTY_OPENSSL_VERSION=${{ env.RESTY_OPENSSL_VERSION }}
            RESTY_OPENSSL_PATCH_VERSION=${{ env.RESTY_OPENSSL_PATCH_VERSION }}
            RESTY_PCRE_VERSION=${{ env.RESTY_PCRE_VERSION }}
          outputs: type=image,name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      # Artifact names are workflow-specific because all reusable workflows share one run.
      # https://docs.github.com/en/actions/tutorials/store-and-share-data
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: openresty-static-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-26.04

    # Wait for all matrix children before publishing the multi-platform image.
    needs:
      - build_docker

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: openresty-static-digests-*
          merge-multiple: true

      # latest and the immutable OpenResty version point to the same manifest list.
      # https://docs.docker.com/build/ci/github-actions/multi-platform/
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ env.RESTY_VERSION }}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: |
          IMAGE="docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools inspect "${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:${{ env.RESTY_VERSION }}"
